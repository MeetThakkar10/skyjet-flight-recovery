<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Flight.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyJet Flight Recovery</title>
    <script>
      (function () {
        var stored = localStorage.getItem("skyjet-theme");
        if (stored !== "light") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
